stages:
- stage: PROD
  displayName: PROD Build & Push

  variables:
    ACR_NAME: ***
    IMAGE_NAME: ***
    CLIENT_ID: ***
    TAG: prod-$(Build.BuildId)

  jobs:
  - job: BuildPush
    steps:
    - checkout: self

    - script: |
        echo "Login using Managed Identity"
        az login --identity --client-id $CLIENT_ID

        echo "Login to ACR"
        az acr login --name $ACR_NAME

        echo "Build image"
        docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:$TAG .

        echo "Push image"
        docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$TAG
      displayName: Build & Push PROD